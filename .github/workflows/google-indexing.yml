name: Ultra-Advanced Google & Global Search Indexing

on:
  push:
    branches: [main]
    paths:
      - 'src/app/**'
      - 'src/components/**'
      - 'src/lib/**'
  schedule:
    # Runs twice daily at 00:00 UTC and 12:00 UTC
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Indexing mode'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'git-diff'
          - 'master-hubs'
      dry_run:
        description: 'Dry run (preview target URLs without sending)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  google-and-global-indexing:
    name: 🚀 Google Indexing & IndexNow Dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Ultra Indexing Engine (Google + IndexNow + Sitemaps)
        env:
          GOOGLE_INDEXING_CLIENT_EMAIL: ${{ secrets.GOOGLE_INDEXING_CLIENT_EMAIL }}
          GOOGLE_INDEXING_PRIVATE_KEY: ${{ secrets.GOOGLE_INDEXING_PRIVATE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          MODE="${{ github.event.inputs.mode || (github.event_name == 'push' && 'git-diff' || 'auto') }}"
          node scripts/advanced-indexing-engine.mjs "$MODE"
