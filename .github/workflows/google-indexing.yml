name: Google Indexing API — Nightly Submission

on:
  # ── Runs every night at 01:30 IST (20:00 UTC) ──
  schedule:
    - cron: '0 20 * * *'

  # ── Manual trigger from GitHub Actions tab ──
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print URLs only, do not submit)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  index-urls:
    name: Submit URLs to Google Indexing API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Trigger Google Indexing API via Cron Endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_URL: ${{ secrets.VERCEL_PRODUCTION_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "⚠️  DRY RUN mode — skipping API submission"
            echo "Would have called: https://$VERCEL_URL/api/cron"
            exit 0
          fi

          echo "🚀 Triggering Google Indexing API at: https://$VERCEL_URL/api/cron"

          HTTP_STATUS=$(curl -s -o /tmp/cron_response.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://$VERCEL_URL/api/cron")

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response:"
          cat /tmp/cron_response.json | python3 -m json.tool || cat /tmp/cron_response.json

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Indexing API call failed with status $HTTP_STATUS"
            exit 1
          fi

          SUBMITTED=$(cat /tmp/cron_response.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('submitted', 0))")
          FAILED=$(cat /tmp/cron_response.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('failed', 0))")
          TOTAL=$(cat /tmp/cron_response.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('totalUrls', 0))")

          echo ""
          echo "✅ Indexing Job Complete"
          echo "   Total URLs in matrix: $TOTAL"
          echo "   Submitted this batch: $SUBMITTED"
          echo "   Failed:               $FAILED"
