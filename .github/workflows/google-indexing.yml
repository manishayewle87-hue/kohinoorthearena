name: Google Indexing API — Nightly Submission

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print URLs only, do not submit)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  index-urls:
    name: Submit URLs to Google Indexing API
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Google Indexing API via Cron Endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "⚠️  DRY RUN — would call: https://www.kohinoorthearena.in/api/cron"
            echo "⚠️  DRY RUN — would call: https://www.mahalaxmithearena.in/api/cron"
            exit 0
          fi

          SECRET="${CRON_SECRET:-e4d531723bb826a44b40f42f431ae24bccb5211f6f34f71b7b85d4cbb0a50134}"

          # Submit for both domains
          for DOMAIN in "www.kohinoorthearena.in" "www.mahalaxmithearena.in"; do
            echo ""
            echo "🚀 Submitting URLs for: $DOMAIN"

            HTTP_STATUS=$(curl -s -o /tmp/cron_response.json -w "%{http_code}" \
              -H "Authorization: Bearer $SECRET" \
              -H "x-cron-secret: $SECRET" \
              "https://$DOMAIN/api/cron?secret=$SECRET")

            echo "HTTP Status: $HTTP_STATUS"
            cat /tmp/cron_response.json
            echo ""

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ $DOMAIN — Indexing submission complete"
            else
              echo "❌ $DOMAIN — Failed with status $HTTP_STATUS"
              exit 1
            fi
          done
